# =============================================================================
# CarDesk「云端应用库」上传端 · Cloudflare Worker 部署配置
#
# 这个 Worker 干两件事：
#
#   1. 提供一个**手机浏览器就能用**的上传页（选 APK → 传 → 进 R2）；
#   2. 每次上传 / 删除后**重写清单** `cardesk/apks.json`（车机读的就是它）。
#
# ## 为什么是 Worker，而不是「网页直接写 R2」
#
# R2 的写入必须带 S3 凭据。凭据一旦写进浏览器里的网页，**等于公开** ——
# 谁打开这个页面就能拿到密钥往你的 bucket 里塞东西。
# 所以网页只负责发请求，**真正的写入发生在 Worker 里**：
# Worker 用 R2 binding 读写 bucket，凭据由 Cloudflare 托管，
# **既不进代码、也不进仓库、也不进手机浏览器**。
#
# ## 密钥从哪来
#
# **不需要 S3 Access Key。** R2 binding 由 Cloudflare 内部授权，
# `env.APKS.put/list/get/delete` 直接可用。
# 真正需要保管的只有一个**上传口令**（`UPLOAD_TOKEN`），
# 用 `wrangler secret put` 存成 secret，不写进这个文件。
#
# ## 部署
#
# ```bash
# cd worker
# npx wrangler login                              # 登录 Cloudflare
# npx wrangler secret put UPLOAD_TOKEN            # 交互输入上传口令（不回显）
# npx wrangler deploy                             # 部署
# ```
#
# 部署完会拿到一个 `*.workers.dev` 地址，直接用手机浏览器打开即可。
# 想用自己的域名，在 Cloudflare Dashboard 给这个 Worker 加一个 Custom Domain
# （例如 `dl.chuxi.bid`）即可；**车机端不依赖这个域名**（车机只读 R2 公开域）。
#
# ## 注意
#
# - `bucket_name` 要和车机读的 bucket 一致（当前是 `file`）。
# - 这里**故意不配** `preview_bucket_name`：
#   本地 `wrangler dev` 会用本地的临时副本，不会碰到线上 bucket。
# - Workers 免费版单次请求体上限 **100MB**，超过的 APK 传不上去
#   （代码里也会显式拒绝并给出提示）。
# =============================================================================

name = "cardesk-apk-store"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 车机读的清单和 APK 都放在这个 bucket 里（和「在线更新」同一个）。
[[r2_buckets]]
binding = "APKS"
bucket_name = "file"
